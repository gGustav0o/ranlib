[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ranobe-lib-cli"
version = "0.1.0"
description = "Manage categorized ranobe volumes in a human-readable JSON file."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ranobe-lib = "ranobe_lib.cli.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["ranobe_lib*"]
